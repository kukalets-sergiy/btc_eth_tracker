services:
  postgres:
    container_name: fastapi-django-postgres
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: fastapi
      POSTGRES_PASSWORD: fastapi
      POSTGRES_DB: fastapi-django
    ports:
      - 5433:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fastapi  -d fastapi-django" ]
      interval: 2s
      retries: 10

  fastapi:
    container_name: fastapi-django
    build: .
    volumes:
      - .:/app
    ports:
      - 8000:8000
    environment:
      DB_NAME: fastapi-django
      DB_USER: fastapi
      DB_PASSWORD: fastapi
      DB_HOST: postgres
      DB_PORT: 5432
    env_file:
      - fastapi.env
    command: ./scripts/runlocalserver.sh
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: "redis:alpine"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      retries: 10

  celery:
    build: .
    command: >
      sh -c "celery -A configurations.celery worker -l INFO --concurrency=4"
    depends_on:
      - fastapi
      - redis
      - postgres
    restart: always
    env_file:
      - fastapi.env
    environment:
      DJANGO_SETTINGS_MODULE: configurations.settings.local

  celery-beat:
    build: .
    command: >
      sh -c "celery -A configurations.celery beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    depends_on:
      - fastapi
      - redis
      - postgres
    restart: always
    env_file:
      - fastapi.env
    environment:
      DJANGO_SETTINGS_MODULE: configurations.settings.local

volumes:
  postgres_data: